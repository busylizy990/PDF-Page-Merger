[pytest]
# Run from the project root:  .python\python.exe -m pytest
#
# The tests import merge and merge_gui from the project root rather than from an
# installed package; tests\conftest.py puts the root on sys.path, so there is no
# packaging step and nothing to install first.
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:merge
    error::DeprecationWarning:merge_gui_under_test
